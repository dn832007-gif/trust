<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DISCIPLINE OS — Nhật trình kỷ luật</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0b0d;
    --bg-elev-1: #121317;
    --bg-elev-2: #191b20;
    --bg-elev-3: #212329;
    --line: rgba(255,255,255,0.07);
    --line-soft: rgba(255,255,255,0.045);
    --ink-1: #f2f1ed;
    --ink-2: #a8a8ad;
    --ink-3: #6c6c73;
    --copper: #c9995a;
    --copper-soft: rgba(201,153,90,0.14);
    --copper-line: rgba(201,153,90,0.35);
    --teal: #4fd1c5;
    --teal-soft: rgba(79,209,197,0.14);
    --violet: #8b7fd1;
    --violet-soft: rgba(139,127,209,0.14);
    --rose: #d17a9e;
    --rose-soft: rgba(209,122,158,0.14);
    --amber: #e08b4b;
    --amber-soft: rgba(224,139,75,0.14);
    --slate: #6d7580;
    --slate-soft: rgba(109,117,128,0.12);
    --danger: #d16a6a;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --font-display: 'Sora', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --ease: cubic-bezier(.22,.9,.32,1);
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(1100px 600px at 85% -10%, rgba(201,153,90,0.08), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(79,209,197,0.06), transparent 60%),
      var(--bg);
    color: var(--ink-1);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height:100vh;
    overflow-x:hidden;
  }
  ::selection{ background: var(--copper-soft); color: var(--ink-1); }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--bg-elev-3); border-radius:8px; }
  ::-webkit-scrollbar-track{ background: transparent; }
  button{ font-family: inherit; cursor:pointer; }
  input, select{ font-family: inherit; }
  a{ color: inherit; text-decoration:none; }

  .app{ display:flex; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:236px; flex-shrink:0;
    border-right:1px solid var(--line);
    background: linear-gradient(180deg, rgba(255,255,255,0.015), transparent 20%);
    padding:26px 16px;
    display:flex; flex-direction:column; gap:28px;
    position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:11px; padding:0 8px; }
  .brand-mark{
    width:34px; height:34px; border-radius:10px;
    background: linear-gradient(145deg, var(--copper), #8a6a3f);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display); font-weight:800; font-size:15px; color:#0a0b0d;
    box-shadow: 0 4px 18px rgba(201,153,90,0.35);
    flex-shrink:0;
  }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; }
  .brand-text b{ font-family: var(--font-display); font-size:14.5px; letter-spacing:0.04em; font-weight:700; }
  .brand-text span{ font-size:10.5px; color: var(--ink-3); letter-spacing:0.09em; text-transform:uppercase; }

  .nav{ display:flex; flex-direction:column; gap:2px; }
  .nav-item{
    display:flex; align-items:center; gap:11px;
    padding:10px 12px; border-radius:10px;
    color: var(--ink-2); font-size:13.5px; font-weight:500;
    border:1px solid transparent; background:none;
    width:100%; text-align:left;
    transition: background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease);
  }
  .nav-item svg{ width:17px; height:17px; flex-shrink:0; opacity:.85; }
  .nav-item:hover{ background: var(--bg-elev-2); color: var(--ink-1); }
  .nav-item.active{ background: var(--copper-soft); color: var(--copper); border-color: var(--copper-line); }
  .nav-item.active svg{ opacity:1; }

  .sidebar-foot{ margin-top:auto; display:flex; flex-direction:column; gap:10px; }

  .level-chip{
    border:1px solid var(--line); background: var(--bg-elev-2);
    border-radius: var(--radius-md); padding:12px 13px;
  }
  .level-chip-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .level-chip-top b{ font-family: var(--font-display); font-size:13px; }
  .level-chip-top span{ font-size:10.5px; color: var(--ink-3); font-family: var(--font-mono); }
  .xp-track{ height:5px; border-radius:4px; background: var(--bg-elev-3); overflow:hidden; }
  .xp-fill{ height:100%; border-radius:4px; background: linear-gradient(90deg, var(--copper), #e8c088); transition: width .5s var(--ease); }
  .reset-btn{
    font-size:11px; color: var(--ink-3); background:none; border:none; padding:4px 8px;
    text-align:left; transition:color .15s;
  }
  .reset-btn:hover{ color: var(--danger); }

  /* ---------- Main ---------- */
  .main{ flex:1; min-width:0; padding:30px 38px 80px; }
  .topbar{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:30px; gap:20px; flex-wrap:wrap; }
  .topbar h1{ font-family: var(--font-display); font-size:26px; font-weight:700; letter-spacing:-0.01em; }
  .topbar p{ color: var(--ink-3); font-size:13px; margin-top:4px; }
  .clock-box{ text-align:right; }
  .clock-time{ font-family: var(--font-mono); font-size:28px; font-weight:600; letter-spacing:0.01em; color:var(--ink-1); }
  .clock-date{ font-size:12px; color: var(--ink-3); margin-top:2px; text-transform:capitalize; }

  .hidden{ display:none !important; }
  .view{ animation: viewIn .38s var(--ease); }
  @keyframes viewIn{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- Cards ---------- */
  .card{
    background: linear-gradient(175deg, var(--bg-elev-1), var(--bg-elev-1) 60%, var(--bg-elev-2));
    border:1px solid var(--line);
    border-radius: var(--radius-lg);
    padding:20px;
    position:relative;
  }
  .card-glass{
    backdrop-filter: blur(14px);
    background: rgba(255,255,255,0.025);
  }
  .card-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.09em; color: var(--ink-3); font-weight:600; margin-bottom:4px; }
  .card-value{ font-family: var(--font-display); font-size:26px; font-weight:700; }

  /* ---------- Dashboard grid ---------- */
  .grid-dash{ display:grid; grid-template-columns: 1.15fr 1fr 1fr; gap:16px; margin-bottom:16px; }
  .grid-dash-2{ display:grid; grid-template-columns: 1.4fr 1fr; gap:16px; }

  .hero-card{ grid-column: span 1; padding:24px; overflow:hidden; }
  .ring-wrap{ display:flex; align-items:center; gap:20px; }
  .ring-svg{ flex-shrink:0; filter: drop-shadow(0 0 14px rgba(201,153,90,0.25)); }
  .ring-meta b{ font-family: var(--font-display); font-size:30px; display:block; }
  .ring-meta .lvl-label{ font-size:11px; color: var(--ink-3); text-transform:uppercase; letter-spacing:0.09em; margin-top:2px; }
  .ring-meta .xp-num{ font-family: var(--font-mono); font-size:12px; color: var(--copper); margin-top:10px; }

  .stat-mini{ display:flex; flex-direction:column; justify-content:space-between; height:100%; }
  .stat-mini .icon{ width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; margin-bottom:14px; }

  .progress-row{ display:flex; align-items:center; gap:10px; margin-top:10px; }
  .progress-track{ flex:1; height:8px; border-radius:6px; background: var(--bg-elev-3); overflow:hidden; }
  .progress-fill{ height:100%; border-radius:6px; transition: width .6s var(--ease); }
  .progress-pct{ font-family: var(--font-mono); font-size:12px; color: var(--ink-2); width:38px; text-align:right; }

  .quote-card{ display:flex; align-items:center; gap:16px; padding:22px 24px; }
  .quote-mark{ font-family: var(--font-display); font-size:44px; color: var(--copper); opacity:.5; line-height:1; flex-shrink:0; }
  .quote-text{ font-family: var(--font-display); font-size:16.5px; font-weight:600; line-height:1.45; }
  .quote-sub{ font-size:11.5px; color: var(--ink-3); margin-top:6px; }

  .today-list{ display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .today-item{
    display:flex; align-items:center; gap:11px; padding:10px 12px;
    border-radius:11px; border:1px solid var(--line-soft); background: var(--bg-elev-2);
    transition: border-color .15s, background .15s;
  }
  .today-item.done{ opacity:.5; }
  .today-item .time{ font-family: var(--font-mono); font-size:11px; color: var(--ink-3); width:82px; flex-shrink:0; }
  .today-item .title{ font-size:13px; flex:1; }
  .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }

  .chk{
    width:18px; height:18px; border-radius:6px; border:1.5px solid var(--ink-3);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    background:none; transition: all .18s var(--ease);
  }
  .chk.on{ background: var(--copper); border-color: var(--copper); }
  .chk svg{ width:11px; height:11px; opacity:0; transition: opacity .15s; }
  .chk.on svg{ opacity:1; }

  /* ---------- Section headers ---------- */
  .section-head{ display:flex; align-items:center; justify-content:space-between; margin:30px 0 14px; }
  .section-head h2{ font-family: var(--font-display); font-size:17px; font-weight:700; }
  .section-head .tag{ font-size:11px; color: var(--ink-3); font-family: var(--font-mono); }

  /* ---------- Weekly Schedule ---------- */
  .week-grid{ display:grid; grid-template-columns: repeat(7, minmax(148px,1fr)); gap:10px; overflow-x:auto; padding-bottom:8px; }
  .day-col{
    background: var(--bg-elev-1); border:1px solid var(--line); border-radius: var(--radius-md);
    padding:12px 10px; min-height:200px; display:flex; flex-direction:column; gap:8px;
  }
  .day-col.today{ border-color: var(--copper-line); box-shadow: 0 0 0 1px var(--copper-line) inset, 0 8px 30px rgba(201,153,90,0.08); }
  .day-col-head{ display:flex; align-items:baseline; justify-content:space-between; padding:2px 2px 8px; border-bottom:1px solid var(--line-soft); margin-bottom:2px; }
  .day-col-head b{ font-family: var(--font-display); font-size:13px; }
  .day-col-head span{ font-size:10px; color: var(--ink-3); font-family: var(--font-mono); }
  .day-col.today .day-col-head b{ color: var(--copper); }

  .block{
    border-radius:10px; padding:8px 9px; border:1px solid var(--line-soft);
    cursor:grab; position:relative; transition: transform .15s var(--ease), box-shadow .15s var(--ease), opacity .15s;
    background: var(--bg-elev-2);
  }
  .block:active{ cursor:grabbing; }
  .block.dragging{ opacity:.35; }
  .block.drop-target{ box-shadow: 0 0 0 1.5px var(--copper-line); }
  .block .b-time{ font-family: var(--font-mono); font-size:9.5px; color: var(--ink-3); }
  .block .b-title{ font-size:11.5px; margin-top:3px; line-height:1.3; }
  .block.done .b-title{ opacity:.45; text-decoration: line-through; }
  .block-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:6px; }
  .block-actions{ display:flex; gap:4px; opacity:0; transition:opacity .15s; }
  .block:hover .block-actions{ opacity:1; }
  .icon-btn{ width:18px; height:18px; border-radius:5px; background:none; border:none; display:flex; align-items:center; justify-content:center; color: var(--ink-3); }
  .icon-btn:hover{ color: var(--ink-1); background: var(--bg-elev-3); }
  .icon-btn svg{ width:11px; height:11px; }

  .legend{ display:flex; flex-wrap:wrap; gap:14px; margin-top:16px; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:11px; color: var(--ink-3); }

  /* ---------- Habits ---------- */
  .habit-grid{ display:flex; flex-direction:column; gap:12px; }
  .habit-card{ padding:18px 20px; }
  .habit-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
  .habit-name{ display:flex; align-items:center; gap:11px; }
  .habit-icon{ width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .habit-name b{ font-family: var(--font-display); font-size:14.5px; display:block; }
  .habit-name span{ font-size:11px; color: var(--ink-3); }
  .streak-badge{
    display:flex; align-items:center; gap:5px; padding:5px 11px; border-radius:20px;
    background: var(--copper-soft); border:1px solid var(--copper-line); color: var(--copper);
    font-family: var(--font-mono); font-size:12px; font-weight:600;
  }
  .habit-stats{ display:flex; gap:22px; margin-bottom:14px; }
  .habit-stat{ font-size:11px; color: var(--ink-3); }
  .habit-stat b{ display:block; font-family: var(--font-mono); font-size:15px; color: var(--ink-1); font-weight:600; margin-top:2px; }
  .heatmap{ display:flex; gap:3px; overflow-x:auto; padding-top:2px; }
  .heat-col{ display:flex; flex-direction:column; gap:3px; }
  .heat-cell{ width:11px; height:11px; border-radius:3px; background: var(--bg-elev-3); flex-shrink:0; }
  .heat-cell.na{ background: transparent; }

  /* ---------- Goals ---------- */
  .goals-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:16px; }
  .goal-card{ padding:20px; display:flex; flex-direction:column; gap:14px; }
  .goal-head{ display:flex; align-items:center; gap:10px; }
  .goal-icon{ width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .goal-head b{ font-family: var(--font-display); font-size:13px; }
  .goal-nums{ display:flex; align-items:baseline; gap:6px; }
  .goal-nums .cur{ font-family: var(--font-display); font-size:24px; font-weight:700; }
  .goal-nums .tgt{ font-size:11.5px; color: var(--ink-3); }
  .goal-edit-row{ display:flex; gap:8px; align-items:center; }
  .num-input{
    width:100%; background: var(--bg-elev-3); border:1px solid var(--line); color: var(--ink-1);
    border-radius:8px; padding:7px 9px; font-size:12.5px; font-family: var(--font-mono);
  }
  .num-input:focus{ outline:none; border-color: var(--copper-line); }
  .input-label{ font-size:10px; color: var(--ink-3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:3px; display:block; }
  .mini-btn{
    background: var(--bg-elev-3); border:1px solid var(--line); color: var(--ink-1);
    border-radius:8px; padding:7px 10px; font-size:12px; font-weight:600; flex-shrink:0;
    transition: background .15s, border-color .15s;
  }
  .mini-btn:hover{ background: var(--bg-elev-2); border-color: var(--copper-line); color: var(--copper); }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background: rgba(6,6,8,0.6); backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center; z-index:100;
    animation: fadeIn .2s var(--ease);
  }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .modal{
    width:340px; background: var(--bg-elev-1); border:1px solid var(--line); border-radius: var(--radius-lg);
    padding:22px; animation: modalIn .25s var(--ease);
  }
  @keyframes modalIn{ from{ opacity:0; transform: translateY(10px) scale(.98);} to{opacity:1; transform:none;} }
  .modal h3{ font-family: var(--font-display); font-size:15px; margin-bottom:16px; }
  .field{ margin-bottom:12px; }
  .field label{ font-size:11px; color: var(--ink-3); text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:5px; }
  .field input, .field select{
    width:100%; background: var(--bg-elev-3); border:1px solid var(--line); color: var(--ink-1);
    border-radius:9px; padding:9px 11px; font-size:13px;
  }
  .field input:focus, .field select:focus{ outline:none; border-color: var(--copper-line); }
  .modal-actions{ display:flex; gap:8px; margin-top:18px; }
  .btn{ flex:1; border:none; border-radius:9px; padding:10px; font-size:13px; font-weight:600; }
  .btn-primary{ background: var(--copper); color:#191008; }
  .btn-primary:hover{ background:#d7a76b; }
  .btn-ghost{ background: var(--bg-elev-3); color: var(--ink-2); }
  .btn-ghost:hover{ background: var(--bg-elev-2); }
  .btn-danger{ background: rgba(209,106,106,0.15); color: var(--danger); border:1px solid rgba(209,106,106,0.35); }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(10px);
    background: var(--bg-elev-2); border:1px solid var(--copper-line); color: var(--ink-1);
    padding:11px 18px; border-radius:11px; font-size:12.5px; display:flex; align-items:center; gap:8px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4); opacity:0; pointer-events:none; transition: all .3s var(--ease);
    z-index:200;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  .toast b{ color: var(--copper); }
  .toast-undo{
    background: var(--copper); color:#191008; border:none; border-radius:7px;
    padding:5px 10px; font-size:11.5px; font-weight:700; flex-shrink:0; cursor:pointer;
  }
  .toast-undo:hover{ background:#d7a76b; }

  /* mobile bottom nav */
  .mobile-nav{ display:none; }

  @media (max-width: 980px){
    .grid-dash{ grid-template-columns: 1fr; }
    .goals-grid{ grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 720px){
    .sidebar{ display:none; }
    .main{ padding:20px 16px 90px; }
    .topbar{ flex-direction:column; align-items:flex-start; }
    .clock-box{ text-align:left; }
    .goals-grid{ grid-template-columns: 1fr 1fr; }
    .mobile-nav{
      display:flex; position:fixed; bottom:0; left:0; right:0; z-index:60;
      background: rgba(18,19,23,0.9); backdrop-filter: blur(16px); border-top:1px solid var(--line);
      justify-content:space-around; padding:10px 6px calc(10px + env(safe-area-inset-bottom));
    }
    .mobile-nav button{ background:none; border:none; color: var(--ink-3); display:flex; flex-direction:column; align-items:center; gap:3px; font-size:9.5px; }
    .mobile-nav button svg{ width:18px; height:18px; }
    .mobile-nav button.active{ color: var(--copper); }
  }
  @media (max-width: 560px){
    .week-grid{ grid-template-columns: repeat(7, 74vw); }
    .goals-grid{ grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: .001s !important; transition-duration: .001s !important; }
  }

  /* ---------- Lock screen ---------- */
  .lock-overlay{
    position:fixed; inset:0; z-index:500;
    background:
      radial-gradient(1100px 600px at 85% -10%, rgba(201,153,90,0.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(79,209,197,0.07), transparent 60%),
      var(--bg);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .lock-overlay.hidden{ display:none; }
  .lock-card{
    width:100%; max-width:340px; text-align:center;
    background: var(--bg-elev-1); border:1px solid var(--line); border-radius: var(--radius-lg);
    padding:34px 28px; animation: modalIn .35s var(--ease);
  }
  .lock-card.shake{ animation: shake .4s var(--ease); }
  @keyframes shake{
    10%,90%{ transform:translateX(-2px);} 20%,80%{ transform:translateX(4px);}
    30%,50%,70%{ transform:translateX(-8px);} 40%,60%{ transform:translateX(8px);}
  }
  .lock-mark{
    width:52px; height:52px; border-radius:14px; margin:0 auto 18px;
    background: linear-gradient(145deg, var(--copper), #8a6a3f);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display); font-weight:800; font-size:22px; color:#0a0b0d;
    box-shadow: 0 8px 24px rgba(201,153,90,0.35);
  }
  .lock-card h2{ font-family: var(--font-display); font-size:17px; letter-spacing:0.03em; margin-bottom:6px; }
  .lock-card p{ font-size:12.5px; color: var(--ink-3); margin-bottom:22px; }
  .lock-card input{
    width:100%; text-align:center; letter-spacing:0.3em; font-family: var(--font-mono); font-size:18px;
    background: var(--bg-elev-3); border:1px solid var(--line); color: var(--ink-1);
    border-radius:11px; padding:13px; transition: border-color .15s;
  }
  .lock-card input:focus{ outline:none; border-color: var(--copper-line); }
  .lock-error{ font-size:11.5px; color: var(--danger); margin-top:12px; opacity:0; transition: opacity .2s; }
  .lock-error.show{ opacity:1; }

  /* ---------- Nhập nhanh lịch ---------- */

const STORAGE_KEY = 'discipline-os-v1';

/* ============================================================

let state = {
  schedule: defaultSchedule(),
  doneMap: {},       // { 'YYYY-MM-DD': { blockId: true } }
  xpTotal: 0,
  goals: {
    weightCurrent: 60, weightTarget: 65,

    sleepTarget: 8,
    waterTarget: 2000,
  },

  sleepMap: {},       // { date: hours }
};

let storageOK = true;

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign({}, state, parsed);
      state.goals = Object.assign({}, state.goals, parsed.goals||{});
      if(!parsed.schedule) state.schedule = defaultSchedule();
    }
  }catch(e){
    storageOK = false;
  }
}

let saveTimer = null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveStateNow, 250);
}

function saveStateNow(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ storageOK = false; }
}


/* ============================================================
   DATE HELPERS
   ============================================================ */

function pad(n){ return String(n).padStart(2,'0'); }
function isoDate(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayKey(){ return isoDate(new Date()); }
function dayKeyOf(date){ return JSDAY_TO_KEY[date.getDay()]; }
function addDays(date, n){ const d = new Date(date); d.setDate(d.getDate()+n); return d; }
function dayOfYear(d){ const start = new Date(d.getFullYear(),0,0); const diff = d - start; return Math.floor(diff / 86400000); }

const VI_WEEKDAY_FULL = { 0:'Chủ Nhật',1:'Thứ Hai',2:'Thứ Ba',3:'Thứ Tư',4:'Thứ Năm',5:'Thứ Sáu',6:'Thứ Bảy' };
const VI_MONTHS = ['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];

/* ============================================================
   DERIVED HELPERS
   ============================================================ */

function isDone(dateKey, blockId){
  return !!(state.doneMap[dateKey] && state.doneMap[dateKey][blockId]);
}

function setDone(dateKey, blockId, val){
  if(!state.doneMap[dateKey]) state.doneMap[dateKey] = {};
  const was = !!state.doneMap[dateKey][blockId];
  if(val === was) return;
  state.doneMap[dateKey][blockId] = val;
  const block = findBlockById(blockId);
  if(block && block.habit){
    state.xpTotal = Math.max(0, state.xpTotal + (val ? XP_PER_HABIT : -XP_PER_HABIT));
  }
  saveState();
}

function findBlockById(id){
  for(const dk of DAY_KEYS){
    const found = state.schedule[dk].find(b=>b.id===id);
    if(found) return found;
  }
  return null;
}

function blocksForDate(date){
  const dk = dayKeyOf(date);
  return state.schedule[dk] || [];
}

function levelFromXP(xp){
  const level = Math.floor(xp/100)+1;
  const within = xp % 100;
  return { level, within };
}

// consecutive-day streak: count back from today while ALL habit blocks scheduled that day were completed
function computeStreak(){
  let streak = 0;
  let cursor = new Date();
  // if today not finished yet, still allow counting from yesterday backward once today fails
  for(let i=0; i<3650; i++){
    const dk = isoDate(cursor);
    const blocks = blocksForDate(cursor).filter(b=>b.habit);
    const allDone = blocks.length>0 && blocks.every(b=>isDone(dk,b.id));
    if(allDone){ streak++; cursor = addDays(cursor,-1); }
    else{
      if(i===0){ cursor = addDays(cursor,-1); continue; } // today not finished yet doesn't break streak
      break;
    }
  }
  return streak;
}

function habitStreak(habitKey){
  let streak = 0;
  let cursor = new Date();
  for(let i=0;i<3650;i++){
    const dk = isoDate(cursor);
    const blocks = blocksForDate(cursor).filter(b=>b.type===habitKey && b.habit);
    if(blocks.length===0){ cursor = addDays(cursor,-1); continue; } // not scheduled that day, skip transparently
    const done = blocks.every(b=>isDone(dk,b.id));
    if(done){ streak++; cursor = addDays(cursor,-1); }
    else{
      if(i===0 || (i>0 && streak===0 && dk===todayKey())){ cursor = addDays(cursor,-1); continue; }
      break;
    }
  }
  return streak;
}

function habitCompletionRate(habitKey, daysBack){
  let scheduled=0, done=0;
  let cursor = new Date();
  for(let i=0;i<daysBack;i++){
    const dk = isoDate(cursor);
    const blocks = blocksForDate(cursor).filter(b=>b.type===habitKey && b.habit);
    if(blocks.length>0){
      scheduled++;
      if(blocks.every(b=>isDone(dk,b.id))) done++;
    }
    cursor = addDays(cursor,-1);
  }
  return scheduled===0 ? 0 : Math.round((done/scheduled)*100);
}

// find nearest actual calendar date (today or the closest upcoming/past occurrence) for a weekday key,
// used just to have a stable date bucket for "done" state in the weekly template view (uses the CURRENT week occurrence)
function nearestDateForWeekday(dk, ref){
  const targetJsDay = JSDAY_TO_KEY.indexOf(dk);
  const refDay = ref.getDay();
  let diff = targetJsDay - refDay;
  return addDays(ref, diff);
}

function attachDragHandlers(){
  const blocks = document.querySelectorAll('.block');
  blocks.forEach(el=>{
    el.addEventListener('dragstart', (e)=>{
      dragState = { day: el.dataset.day, idx: parseInt(el.dataset.idx) };
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', ()=>{
      el.classList.remove('dragging');
      document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));
    });
    el.addEventListener('dragover', (e)=>{
      e.preventDefault();
      if(!dragState || dragState.day !== el.dataset.day) return;
      el.classList.add('drop-target');
    });
    el.addEventListener('dragleave', ()=>{ el.classList.remove('drop-target'); });
    el.addEventListener('drop', (e)=>{
      e.preventDefault();
      el.classList.remove('drop-target');
      if(!dragState) return;
      const day = dragState.day;
      if(el.dataset.day !== day) return;
      const fromIdx = dragState.idx;
      const toIdx = parseInt(el.dataset.idx);
      if(fromIdx === toIdx) return;
      const arr = state.schedule[day];
      const [moved] = arr.splice(fromIdx,1);
      arr.splice(toIdx,0,moved);
      saveState();
      dragState = null;
      renderSchedule();
    });
  });
}

function renderHeatmap(container, habitKey, color){
  // 14 weeks x 7 days, most recent on the right
  const weeks = 14;
  const now = new Date();
  const todayJs = now.getDay();
  // find most recent Sunday-start alignment isn't necessary — just build columns of 7 going backward
  const totalDays = weeks*7;
  const startOffset = totalDays - 1;
  const cellsByCol = [];
  for(let w=0; w<weeks; w++){
    cellsByCol.push([]);
  }
  for(let i=0;i<totalDays;i++){
    const d = addDays(now, -(startOffset - i));
    const col = Math.floor(i/7);
    const row = i%7;
    cellsByCol[col][row] = d;
  }
  container.innerHTML = '';
  cellsByCol.forEach(col=>{
    const colEl = document.createElement('div');
    colEl.className = 'heat-col';
    col.forEach(d=>{
      const dk = isoDate(d);
      const blocks = blocksForDate(d).filter(b=>b.type===habitKey && b.habit);
      const cell = document.createElement('div');
      if(blocks.length===0){
        cell.className = 'heat-cell na';
      } else {
        const done = blocks.every(b=>isDone(dk,b.id));
        cell.className = 'heat-cell';
        if(done){
          cell.style.background = color;
        } else if(d > now){
          cell.style.opacity = '0.3';
        }
        cell.title = `${dk}`;
      }
      colEl.appendChild(cell);
    });
    container.appendChild(colEl);
  });
}

function clampPct(v){ return Math.max(0, Math.min(100, v)); }

let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.innerHTML = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function showUndoToast(msg, onUndo){
  const t = document.getElementById('toast');
  clearTimeout(toastTimer);
  t.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = msg;
  const btn = document.createElement('button');
  btn.textContent = 'Hoàn tác';
  btn.className = 'toast-undo';
  btn.addEventListener('click', ()=>{ t.classList.remove('show'); onUndo(); });
  t.appendChild(span); t.appendChild(btn);
  t.classList.add('show');
  toastTimer = setTimeout(()=>t.classList.remove('show'), 6000);
}

function foldVN(s){
  return Array.from(String(s).normalize('NFC')).map(c=>{
    if(c==='đ') return 'd';
    if(c==='Đ') return 'd';
    let r = c.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const l = r.toLowerCase();
    return l.length===r.length ? l : r;
  }).join('');
}

const DAY_WORD = { hai:'T2', ba:'T3', tu:'T4', nam:'T5', sau:'T6', bay:'T7' };
const EN_DAY = { monday:'T2', tuesday:'T3', wednesday:'T4', thursday:'T5', friday:'T6', saturday:'T7', sunday:'CN' };
const D_ONE = '(?:t\\s*[2-7]|thu\\s*(?:[2-7]|hai|ba|tu|nam|sau|bay)|cn|chu\\s*nhat|monday|tuesday|wednesday|thursday|friday|saturday|sunday)(?![a-z0-9])';
const DAYEXPR_RE = new RegExp('(^|[^a-z0-9])(' + D_ONE + '(?:\\s*(?:-|–|—|~|,|/|&|\\+|den|to|va)\\s*(?:' + D_ONE + '|[2-7](?![0-9:hg.])))*)');
const ALLDAYS_RE = /(^|[^a-z0-9])(hang\s*ngay|moi\s*ngay|daily|every\s*day|everyday|ca\s*tuan|tat\s*ca\s*(?:cac\s*)?ngay)(?![a-z0-9])/;

function tokToKey(t){
  t = t.replace(/\s+/g,'');
  let m;
  if((m = t.match(/^t([2-7])$/))) return DAY_KEYS[+m[1]-2];
  if((m = t.match(/^thu([2-7])$/))) return DAY_KEYS[+m[1]-2];
  if((m = t.match(/^thu(hai|ba|tu|nam|sau|bay)$/))) return DAY_WORD[m[1]];
  if(t==='cn' || t==='chunhat') return 'CN';
  if(EN_DAY[t]) return EN_DAY[t];
  return null;
}

function daysFromExpr(expr){
  const parts = expr.match(/t\s*[2-7]|thu\s*(?:[2-7]|hai|ba|tu|nam|sau|bay)|cn|chu\s*nhat|monday|tuesday|wednesday|thursday|friday|saturday|sunday|[2-7]|-|–|—|~|,|\/|&|\+|den|to|va/g) || [];
  const set = []; let last = null, range = false;
  const add = k=>{ if(k && !set.includes(k)) set.push(k); };
  for(const p of parts){
    if(/^(-|–|—|~|den|to)$/.test(p)){ range = true; continue; }
    if(/^(,|\/|&|\+|va)$/.test(p)){ range = false; continue; }
    const k = /^[2-7]$/.test(p) ? DAY_KEYS[+p-2] : tokToKey(p);
    if(!k) continue;
    if(range && last){
      let a = DAY_KEYS.indexOf(last), b = DAY_KEYS.indexOf(k);
      if(a<=b){ for(let i=a;i<=b;i++) add(DAY_KEYS[i]); }
      else { for(let i=a;i<DAY_KEYS.length;i++) add(DAY_KEYS[i]); for(let i=0;i<=b;i++) add(DAY_KEYS[i]); }
    } else add(k);
    last = k; range = false;
  }
  return set;
}

// tìm biểu thức ngày trong dòng (đã fold). Trả {days, s, e} hoặc null
function findDays(plain){
  let m = ALLDAYS_RE.exec(plain);
  if(m){ const s = m.index + m[1].length; return { days: DAY_KEYS.slice(), s, e: m.index + m[0].length }; }
  m = DAYEXPR_RE.exec(plain);
  if(m){
    const s = m.index + m[1].length;
    const days = daysFromExpr(m[2]);
    if(days.length) return { days, s, e: m.index + m[0].length };
  }
  return null;
}

const HP = '(\\d{1,2})(?:\\s*(?::|h(?![a-z])|gio(?![a-z])|g(?![a-z]))\\s*(\\d{2})?(?::\\d{2})?|\\.(\\d{2}))?';
const TIME_RANGE_RE = new RegExp('(^|[^0-9a-z])' + HP + '\\s*(?:-|–|—|~|den|to)\\s*' + HP + '(?![0-9])');
const SINGLE_TIME_RE = /(^|[^0-9a-z])(\d{1,2})\s*(?::|h(?![a-z])|gio(?![a-z]))\s*(\d{2})?(?::\d{2})?(?![0-9])/g;

function toHM(h, m){
  h = +h; m = m ? +m : 0;
  if(h===24 && m===0) return '23:59';
  if(h>23 || m>59) return null;
  return pad(h) + ':' + pad(m);
}
function addMinutes(hm, plus){
  const [h,m] = hm.split(':').map(Number);
  const t = Math.min(h*60+m+plus, 23*60+59);
  return pad(Math.floor(t/60)) + ':' + pad(t%60);
}

function findTimes(plain){
  let m = TIME_RANGE_RE.exec(plain);
  if(m){
    const seg = m[0].slice(m[1].length);
    if(/[:hg.]/.test(seg)){
      const st = toHM(m[2], m[3]||m[4]), en = toHM(m[5], m[6]||m[7]);
      if(st && en) return { start:st, end:en, spans:[[m.index+m[1].length, m.index+m[0].length]] };
    }
  }
  SINGLE_TIME_RE.lastIndex = 0;
  const found = []; let x;
  while((x = SINGLE_TIME_RE.exec(plain))){
    const hm = toHM(x[2], x[3]);
    if(hm) found.push({ hm, s: x.index + x[1].length, e: x.index + x[0].length });
    if(found.length>=2) break;
  }
  if(found.length>=2) return { start:found[0].hm, end:found[1].hm, spans:[[found[0].s,found[0].e],[found[1].s,found[1].e]] };
  if(found.length===1) return { start:found[0].hm, end:addMinutes(found[0].hm, 60), spans:[[found[0].s,found[0].e]], guessedEnd:true };
  return null;
}

function guessType(title){
  const t = ' ' + foldVN(title) + ' ';
  const has = re => re.test(t);
  if(has(/ngu trua|nghi ngoi|nghi trua|thu gian|giai lao|relax|\bnap\b|nghi ngơi/)) return 'rest';
  if(has(/\bngu\b|di ngu|sleep|\bbed\b/)) return 'sleep';
  if(has(/tieng anh|english|ielts|toeic|toefl|anh van|\bpte\b/)) return 'english';
  if(has(/on tap|on bai|doc sach|review|xem lai|tong hop|\bbook\b|flashcard/)) return 'review';
  if(has(/chay bo|\bchay\b|\brun\b|jog/)) return 'run';
  if(has(/\btap\b(?! trung)|gym|calis|the duc|workout|yoga|the thao|push ?up|squat|\bboi\b|hit xa/)) return 'workout';
  if(has(/di hoc|tren truong|\blop\b|\btiet\b|truong|giang duong|lecture|\bclass\b|hoc phan|tren lop/)) return 'school';
  if(has(/\bhoc\b|study|\bcode\b|coding|lap trinh|lam bai|tu hoc|khoa hoc|course|project|nghien cuu|bai tap|deadline|lam viec|\bwork\b|\bdoc\b/)) return 'study';
  if(has(/\ban\b|bua |com |meal|nau |breakfast|lunch|dinner|ve sinh|ca phe|coffee/)) return 'meal';
  return 'free';
}

const HABIT_TYPES = ['workout','study','english','run','review'];

function typeLookup(){
  const map = {};
  Object.keys(TYPE_META).forEach(k=>{ map[k] = k; map[foldVN(TYPE_META[k].label)] = k; });
  Object.assign(map, {'van dong':'workout','the duc':'workout','an uong':'meal','truong hoc':'school','hoc moi':'study','nghi ngoi':'rest','tu do':'free','on tap':'review','chay bo':'run','tieng anh':'english','ngu':'sleep'});
  return map;
}

function normTimeStr(v){
  if(v==null) return null;
  const s = foldVN(String(v)).trim();
  const m = s.match(/^(\d{1,2})(?:\s*(?::|h|g|gio|\.)\s*(\d{1,2}))?(?::\d{2})?$/);
  if(!m) return null;
  return toHM(m[1], m[2]);
}

function cleanTitle(s){
  return s.replace(/\s+/g,' ').replace(/^[\s:;,\-–—|>•*"'\u2022]+|[\s:;,\-–—|>•*"'\u2022]+$/g,'').trim();
}

let _impId = 0;
function importId(){ return 'i' + Date.now().toString(36) + (++_impId).toString(36); }

function makeItem(day, start, end, title, type, habit, extra){
  let capped = false;
  if(end <= start){ end = '23:59'; capped = true; if(end <= start){ return null; } }
  title = title || (type && TYPE_META[type] ? TYPE_META[type].label : 'Hoạt động');
  const ty = TYPE_META[type] ? type : guessType(title);
  return Object.assign({ day, start, end, title, type: ty, habit: habit==null ? HABIT_TYPES.includes(ty) : !!habit, capped }, extra||{});
}

function parseScheduleJSON(obj, defaultDays){
  const items = [], bad = [];
  const push = (dayKeys, it)=>{
    const st = normTimeStr(it.start || it.from || it.begin || it.bat_dau);
    const en = normTimeStr(it.end || it.to || it.finish || it.ket_thuc);
    const title = cleanTitle(String(it.title || it.name || it.ten || it.activity || ''));
    if(!st || !en){ bad.push(JSON.stringify(it).slice(0,80)); return; }
    let ty = it.type ? (typeLookup()[foldVN(String(it.type)).trim()] || null) : null;
    dayKeys.forEach(d=>{ const x = makeItem(d, st, en, title, ty, it.habit); if(x) items.push(x); else bad.push(JSON.stringify(it).slice(0,80)); });
  };
  const dayOf = v => { const f = findDays(' ' + foldVN(String(v)) + ' '); return f ? f.days : null; };
  if(Array.isArray(obj)){
    obj.forEach(it=>{ if(it && typeof it==='object') push(dayOf(it.day || it.ngay || it.thu || '') || defaultDays, it); });
  } else if(obj && typeof obj==='object'){
    Object.keys(obj).forEach(k=>{
      const ds = dayOf(k);
      if(ds && Array.isArray(obj[k])) obj[k].forEach(it=> push(ds, it));
    });
  }
  return { items, bad };
}

function parseScheduleText(text, defaultDays){
  text = String(text||'').trim();
  if(!text) return { items:[], bad:[] };
  if(text[0]==='[' || text[0]==='{'){
    try{ return parseScheduleJSON(JSON.parse(text), defaultDays); }catch(e){}
  }
  const items = [], bad = [];
  const types = typeLookup();
  let ctx = null;
  const lines = text.replace(/\r/g,'').split('\n');
  for(let raw of lines){
    let line = raw.replace(/[*_`]+/g,'').replace(/^\s*(?:[-*•·▪●○>#]+|\d+[.)])\s+/, '').replace(/^\s*#+\s*/, '');
    if(!line.trim()) continue;
    if(/^[\s|:\-–—]+$/.test(line)) continue;                       // dòng kẻ bảng
    const plain = foldVN(line);
    if(!/\d/.test(plain)){
      const hdr = ['gio','thoi gian','time','hoat dong','noi dung','task','title','ten','loai','type','bat dau','ket thuc','start','end','thu','ngay','day'].filter(w=>plain.includes(w)).length;
      const fd = findDays(' ' + plain + ' ');
      if(hdr>=2 && !fd) continue;                                    // hàng tiêu đề bảng
    }
    // tìm ngày
    const padded = ' ' + plain;                                       // đệm 1 ký tự để regex (^|[^..]) hoạt động
    const fd = findDays(padded);
    const spans = [];
    let lineDays = null;
    let masked = padded;
    if(fd){
      lineDays = fd.days;
      spans.push([fd.s-1, fd.e-1]);
      masked = padded.slice(0, fd.s) + ' '.repeat(fd.e - fd.s) + padded.slice(fd.e);
    }
    const ft = findTimes(masked);
    if(ft) ft.spans.forEach(sp=> spans.push([sp[0]-1, sp[1]-1]));
    // phần còn lại của dòng (dùng bản gốc)
    let rest = '';
    let cur = 0;
    spans.sort((a,b)=>a[0]-b[0]).forEach(([s,e])=>{ rest += line.slice(cur, Math.max(cur,s)) + ' \t '; cur = Math.max(cur,e); });
    rest += line.slice(cur);
    const pieces = rest.split(/\t|\||;/).map(cleanTitle).filter(Boolean);

    if(!ft){
      if(lineDays && pieces.join(' ').length <= 30){ ctx = lineDays; continue; }   // dòng tiêu đề ngày
      bad.push(raw.trim()); continue;
    }
    let type = null, habit = null; const titleParts = [];
    pieces.forEach(p=>{
      const f = foldVN(p).trim();
      if(types[f] && !type && pieces.length>1){ type = types[f]; return; }
      if(/^(thoi quen|habit|✓|✔|x|co|yes|true)$/.test(f)){ habit = true; return; }
      if(/^(khong|no|false)$/.test(f)){ habit = false; return; }
      titleParts.push(p);
    });
    const title = cleanTitle(titleParts.join(' — '));
    const days = lineDays || ctx || defaultDays;
    let ok = false;
    days.forEach(d=>{
      const it = makeItem(d, ft.start, ft.end, title, type, habit, { guessedEnd: !!ft.guessedEnd });
      if(it){ items.push(it); ok = true; }
    });
    if(!ok) bad.push(raw.trim());
  }
  return { items, bad };
}

function scheduleToText(){
  const out = [];
  DAY_KEYS.forEach(d=>{
    const list = state.schedule[d] || [];
    if(!list.length) return;
    out.push(DAY_LABELS[d] + ':');
    list.forEach(b=> out.push(`${b.start}-${b.end} ${b.title} | ${TYPE_META[b.type] ? TYPE_META[b.type].label : b.type}`));
    out.push('');
  });
  return out.join('\n').trim();
}

/* ---------- Đọc file: txt / csv / tsv / json / md / xlsx ---------- */
function loadXLSX(){
  return new Promise((res, rej)=>{
    if(window.XLSX) return res(window.XLSX);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = ()=> res(window.XLSX);
    s.onerror = ()=> rej(new Error('không tải được thư viện đọc Excel (kiểm tra mạng)'));
    document.head.appendChild(s);
  });
}

function csvToTabs(txt){
  const first = txt.split('\n')[0] || '';
  const delim = (first.match(/;/g)||[]).length > (first.match(/,/g)||[]).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for(let i=0;i<txt.length;i++){
    const c = txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if(c==='"') q = true;
    else if(c===delim){ row.push(cur); cur = ''; }
    else if(c==='\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
    else if(c!=='\r') cur += c;
  }
  row.push(cur); rows.push(row);
  return rows.filter(r=>r.some(x=>x.trim())).map(r=>r.join('\t')).join('\n');
}

async function readScheduleFile(f){
  const name = f.name.toLowerCase();
  if(/\.(xlsx|xls)$/.test(name)){
    const X = await loadXLSX();
    const wb = X.read(await f.arrayBuffer(), { type:'array' });
    const out = [];
    wb.SheetNames.forEach(n=>{
      if(wb.SheetNames.length>1 && findDays(' ' + foldVN(n) + ' ')) out.push(n);     // tên sheet = thứ
      out.push(X.utils.sheet_to_csv(wb.Sheets[n], { FS:'\t', blankrows:false }));
    });
    return out.join('\n');
  }
  const txt = await f.text();
  return /\.csv$/.test(name) ? csvToTabs(txt) : txt;
}

    const f = e.target.files[0]; if(!f) return;
    try{ ta.value = await readScheduleFile(f); refresh(); }
    catch(err){ showToast('Không đọc được file: ' + (err.message || err)); }
    e.target.value = '';
  });
  $('#im-cancel').addEventListener('click', ()=>overlay.remove());
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });

  // Kéo-thả file trực tiếp vào ô văn bản
  ['dragover','dragenter'].forEach(ev=> ta.addEventListener(ev, e=>{ e.preventDefault(); ta.classList.add('drop-hover'); }));
  ['dragleave','dragend'].forEach(ev=> ta.addEventListener(ev, ()=> ta.classList.remove('drop-hover')));
  ta.addEventListener('drop', async e=>{
    e.preventDefault(); ta.classList.remove('drop-hover');
    const f = e.dataTransfer.files && e.dataTransfer.files[0]; if(!f) return;
    try{ ta.value = await readScheduleFile(f); refresh(); }
    catch(err){ showToast('Không đọc được file: ' + (err.message || err)); }
  });

  // Ctrl/Cmd + Enter để nhập nhanh
  ta.addEventListener('keydown', e=>{
    if((e.ctrlKey||e.metaKey) && e.key==='Enter' && !okBtn.disabled) okBtn.click();
  });

  okBtn.addEventListener('click', ()=>{
    if(!parsed.items.length) return;
    const backup = clone(state.schedule);
    if($('#im-mode').value==='replace') DAY_KEYS.forEach(d=>{ state.schedule[d] = []; });
    let added = 0, skipped = 0;
    parsed.items.forEach(i=>{
      const list = state.schedule[i.day];
      if(list.some(b=>b.start===i.start && b.end===i.end && b.title===i.title)){ skipped++; return; }
      list.push(blk(importId(), i.start, i.end, i.title, i.type, i.habit));
      added++;
    });
    DAY_KEYS.forEach(sortDay);
    saveState();
    overlay.remove();
    renderAll();
    showUndoToast(`Đã nhập ${added} mục` + (skipped ? ` (bỏ ${skipped} mục trùng)` : ''), ()=>{
      state.schedule = backup; saveState(); renderAll(); showToast('Đã hoàn tác');
    });
  });
  refresh();
  ta.focus();
}

/* ---------- Sao chép lịch của 1 ngày sang các ngày khác ---------- */
function openCopyDayModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>⧉ Sao chép lịch giữa các ngày</h3>
      <div class="field"><label>Sao chép từ</label>
        <select id="cp-src">${DAY_KEYS.map(d=>`<option value="${d}">${DAY_LABELS[d]} (${state.schedule[d].length} mục)</option>`).join('')}</select></div>
      <div class="field"><label>Sang các ngày</label>
        <div class="day-checks" id="cp-days">${DAY_KEYS.map(d=>`<label class="day-check"><input type="checkbox" value="${d}"> ${DAY_LABELS[d]}</label>`).join('')}</div></div>
      <p style="font-size:11.5px; color:var(--ink-3); line-height:1.5;">Lịch của các ngày được chọn sẽ được thay bằng lịch của ngày nguồn.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cp-cancel">Hủy</button>
        <button class="btn btn-primary" id="cp-ok">Sao chép</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const $ = s=>overlay.querySelector(s);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  $('#cp-cancel').addEventListener('click', ()=>overlay.remove());
  $('#cp-ok').addEventListener('click', ()=>{
    const src = $('#cp-src').value;
    const targets = Array.from(overlay.querySelectorAll('#cp-days input:checked')).map(x=>x.value).filter(d=>d!==src);
    if(!targets.length){ showToast('Chọn ít nhất 1 ngày đích'); return; }
    targets.forEach(d=>{
      state.schedule[d] = state.schedule[src].map(b=>blk(importId(), b.start, b.end, b.title, b.type, b.habit));
    });
    saveState(); overlay.remove(); renderAll();
    showToast(`Đã sao chép sang ${targets.length} ngày`);
  });
}

function clearAllSchedule(){
  openConfirm('Xóa toàn bộ thời gian biểu?', 'Tất cả hoạt động của cả 7 ngày sẽ bị xóa (XP và thói quen đã hoàn thành vẫn giữ nguyên).', 'Xóa hết', ()=>{
    const backup = clone(state.schedule);
    DAY_KEYS.forEach(d=>{ state.schedule[d] = []; });
    saveState(); renderAll();
    showUndoToast('Đã xóa toàn bộ lịch', ()=>{
      state.schedule = backup; saveState(); renderAll(); showToast('Đã khôi phục lịch');
    });
  });
}


/* ============================================================
   NAVIGATION
   ============================================================ */

const VIEW_TITLES = {
  dashboard: ['Dashboard', 'Tổng quan kỷ luật hôm nay'],
  schedule: ['Thời gian biểu tuần', 'Kéo thả để sắp xếp lại, bấm để chỉnh sửa'],
  habits: ['Thói quen', 'Chuỗi ngày, tỷ lệ hoàn thành và heatmap'],
  goals: ['Mục tiêu cá nhân', 'Theo dõi cân nặng, tập luyện, giấc ngủ và nước uống'],
};

function setView(view){
  document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));
  document.getElementById('view-'+view).classList.remove('hidden');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view===view));
  document.querySelectorAll('#mobile-nav button').forEach(n=>n.classList.toggle('active', n.dataset.view===view));
  const [title,sub] = VIEW_TITLES[view];
  document.getElementById('page-title').textContent = title;
  document.getElementById('page-sub').textContent = sub;
  renderView(view);
}

function renderView(view){
  if(view==='dashboard') renderDashboard();
  else if(view==='schedule') renderSchedule();
  else if(view==='habits') renderHabits();
  else if(view==='goals') renderGoals();
}

function renderAll(){
  const active = document.querySelector('.nav-item.active');
  const view = active ? active.dataset.view : 'dashboard';
  renderView(view);
  // dashboard stats always kept fresh for sidebar xp chip
  const { level, within } = levelFromXP(state.xpTotal);
  document.getElementById('sb-level').textContent = `Cấp ${level}`;
  document.getElementById('sb-xp-text').textContent = `${within} / 100 XP`;
  document.getElementById('sb-xp-fill').style.width = within+'%';
}

/* ============================================================
   INIT
   ============================================================ */

async function init(){
  document.querySelectorAll('.nav-item, #mobile-nav button').forEach(btn=>{
    btn.addEventListener('click', ()=> setView(btn.dataset.view));
  });

  document.getElementById('btn-import').addEventListener('click', openImportModal);
  document.getElementById('btn-copyday').addEventListener('click', openCopyDayModal);
  document.getElementById('btn-clearall').addEventListener('click', clearAllSchedule);

  document.getElementById('reset-data').addEventListener('click', ()=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h3>Đặt lại toàn bộ dữ liệu?</h3>
        <p style="font-size:12.5px; color:var(--ink-2); line-height:1.5;">Toàn bộ tiến trình, XP, streak và lịch tùy chỉnh sẽ bị xóa vĩnh viễn.</p>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="rs-cancel">Hủy</button>
          <button class="btn btn-danger" id="rs-confirm">Xóa toàn bộ</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
    overlay.querySelector('#rs-cancel').addEventListener('click', ()=>overlay.remove());
    overlay.querySelector('#rs-confirm').addEventListener('click', async ()=>{
      state = {
        schedule: defaultSchedule(), doneMap:{}, xpTotal:0,
        goals:{ weightCurrent:60, weightTarget:65, workoutsTarget:7, sleepTarget:8, waterTarget:2000 },
        waterMap:{}, sleepMap:{}
      };
      saveState();
      overlay.remove();
      renderAll();
      showToast('Đã đặt lại dữ liệu');
    });
  });

  renderClock();
  setInterval(renderClock, 1000);
  setInterval(()=>{
    // keep dashboard progress ring/day accurate even if left open across midnight
    const active = document.querySelector('.nav-item.active');
    if(active && active.dataset.view==='dashboard') renderDashboard();
  }, 30000);

  setView('dashboard');
}

/* ============================================================
   LOCK SCREEN → APP
   ============================================================ */

function setupLock(){
  const overlay = document.getElementById('lock-overlay');
  const form = document.getElementById('lock-form');
  const input = document.getElementById('lock-input');
  const card = overlay.querySelector('.lock-card');
  const errEl = document.getElementById('lock-error');

  form.addEventListener('submit', (e)=>{
    e.preventDefault();
    if(input.value === APP_PASSWORD){
      overlay.classList.add('hidden');
      errEl.classList.remove('show');
      loadState().then(bootApp);
    } else {
      errEl.classList.add('show');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
      input.value = '';
      input.focus();
    }
  });

  input.focus();
}

let appBooted = false;
function bootApp(){
  if(appBooted) return;
  appBooted = true;
  init();
}

setupLock();

})();
</script>
